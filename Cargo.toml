[package]
name = "portalcontrol"
version = "0.8.0"
edition = "2021"
authors = ["Surenjanath Singh"]
homepage = "https://github.com/surenjanath"
description = "PortalControl-Core: native cross-platform automation supervisor"
license = "MIT"

[[bin]]
name = "portalcontrol"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync", "signal"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Local wall-clock time for cron schedules.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# CPU / memory of the host and of each supervised process tree.
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }
# Password hashing and random tokens for the optional dashboard login.
pbkdf2 = "0.12"
sha2 = "0.10"
getrandom = "0.2"
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

# libgit2 is compiled in, so no system Git install is needed.
[target.'cfg(windows)'.dependencies]
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2"] }
winreg = "0.55"
# Console attach and the native About window.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
libc = "0.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.37.2"
tray-icon = "0.26.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
